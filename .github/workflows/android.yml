# Builds the Android app (APK) and attaches it to the "android" release, so the download
# page's button always gets the newest one. The APK opens the live game, so normal game
# updates don't need a new APK; this only runs when the Android wrapper or icons change.
# Needs two repository secrets (the signing key, so every APK can update the last one):
#   ANDROID_KEYSTORE_B64       base64 of vaquest-release.p12
#   ANDROID_KEYSTORE_PASSWORD  its password
name: Android app
on:
  push:
    branches: [main]
    paths: ['android-app/**', 'icons/**', 'tools/android_icons.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing key is set up
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::No APK built yet: add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets (see the README), then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Create the Android project
        if: steps.key.outputs.ready == 'true'
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python -m pip install --quiet pillow
          python ../tools/android_icons.py android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build
        if: steps.key.outputs.ready == 'true'
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        if: steps.key.outputs.ready == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias vaquest --key-pass env:KS_PASS --out VA-Quest.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs VA-Quest.apk | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
      - name: Publish to the "android" release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --latest --title "VA Quest for Android" \
            --notes "Download VA-Quest.apk below and open it on your phone. The app loads the live game, so it updates itself."
          gh release upload android VA-Quest.apk --clobber
