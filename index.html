<title>VA Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; a pixel "night city" arena on top, a question card below.
   Deliberately single-theme (a dark arcade night), so colours are set explicitly on :root. */
:root {
  --night: #15122d;      /* page */
  --panel: #221d47;      /* cards */
  --panel2: #2e2763;     /* raised / hover */
  --line: #443b8a;       /* borders */
  --ink: #f5f2ff;        /* text */
  --muted: #b1abdc;      /* secondary text */
  --amber: #ffb547;      /* accent: coins, primary buttons */
  --good: #3ddc97;
  --bad: #ff5f7e;
  --shadow: #0b0920;
  --display: 'Pixelify Sans', 'Courier New', monospace;
  --body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font: 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, .disp { font-family: var(--display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h1 { font-size: 2.6rem; line-height: 1; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }

button, .btn {
  font: 700 1rem var(--body); color: var(--ink); background: var(--panel2);
  border: 3px solid var(--line); border-radius: 6px; padding: 12px 14px;
  box-shadow: 0 4px 0 var(--shadow); cursor: pointer; text-align: left;
  transition: transform .06s, background .15s, border-color .15s;
}
button:hover:not(:disabled) { background: #3a3178; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.good:disabled, button.bad:disabled, .match button.ok:disabled { opacity: 1; }
.opts button:disabled:not(.good):not(.bad) { opacity: .35; }
button.primary { background: var(--amber); border-color: #ffd28f; color: #2a1800; font-family: var(--display); font-size: 1.15rem; text-align: center; }
button.primary:hover:not(:disabled) { background: #ffc46b; }
button.ghost { background: transparent; box-shadow: none; border-color: transparent; padding: 6px 8px; color: var(--muted); }
button.ghost:hover { background: var(--panel); }
button.good { border-color: var(--good); background: #1d4a3f; }
button.bad { border-color: var(--bad); background: #4d1f33; animation: shake .35s; }
.icon { font-family: var(--display); }

.card { background: var(--panel); border: 3px solid var(--line); border-radius: 8px; padding: 14px; }

/* HUD */
.hud { display: flex; align-items: center; gap: 10px; }
.hud .who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.hud .who .px { width: 40px; height: auto; }
.hud .name { font-family: var(--display); font-size: 1.05rem; line-height: 1.1; }
.bar { height: 10px; background: var(--shadow); border-radius: 3px; overflow: hidden; border: 2px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .4s; }
.pill { font-family: var(--display); background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; font-size: .95rem; }
.coin { color: var(--amber); }

/* title */
.title-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 3px solid var(--line); }
.title-wrap canvas.sky { width: 100%; height: 260px; display: block; }
.title-over { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; gap: 6px; background: linear-gradient(transparent 30%, #15122dcc); }
.title-over .px { position: absolute; right: 22px; bottom: 18px; width: 96px; height: auto; animation: bob 1.4s steps(2) infinite; }
.tag { font-family: var(--display); color: var(--amber); font-size: 1rem; }
input[type=text], textarea {
  font: 1rem var(--body); color: var(--ink); background: var(--shadow); border: 3px solid var(--line);
  border-radius: 6px; padding: 10px 12px; width: 100%; box-sizing: border-box;
}
input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 1px; }

/* map */
.district { display: grid; grid-template-columns: 86px 1fr; gap: 12px; align-items: center; text-align: left; padding: 10px; width: 100%; }
.district canvas { width: 86px; height: 64px; border-radius: 4px; }
.district .meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.district .nm { font-family: var(--display); font-size: 1.15rem; line-height: 1.15; }
.district .bl { font-weight: 400; font-size: .85rem; color: var(--muted); }
.district .pr { font-size: .8rem; color: var(--amber); font-weight: 700; }
.district.locked { filter: grayscale(.9); }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tools button { text-align: center; padding: 12px 8px; }
.tools .disp { display: block; font-size: 1.05rem; }
.tools small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }

/* district path */
.path { display: flex; flex-direction: column; gap: 6px; position: relative; padding-block: 6px; }
.node { display: flex; align-items: center; gap: 12px; width: 78%; }
.node:nth-child(even) { align-self: flex-end; }
.node .dot { width: 54px; height: 54px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; border: 3px solid var(--line); background: var(--panel2); box-shadow: 0 4px 0 var(--shadow); }
.node.done .dot { border-color: var(--good); }
.node.next .dot { border-color: var(--amber); animation: pulse 1.2s infinite; }
.node .lbl { font-family: var(--display); font-size: 1rem; line-height: 1.15; }
.node .st { color: var(--amber); font-size: .9rem; letter-spacing: 2px; }
.node.boss .dot { width: 72px; height: 72px; border-radius: 10px; }
.node.boss .dot canvas { width: 54px; height: auto; }

/* battle */
.arena { position: relative; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; height: 190px; }
.arena canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.fighter { position: absolute; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fighter.me { left: 8%; }
.fighter.foe { right: 8%; }
.fighter .px { height: 96px; width: auto; animation: bob 1.2s steps(2) infinite; }
.fighter.foe .px { height: 92px; }
.fighter.boss .px { height: 118px; }
.fighter.hit .px { animation: hit .4s; }
.fighter.lunge .px { animation: lunge .35s; }
.fighter.foe.lunge .px { animation: lungeL .35s; }
.pet { position: absolute; left: calc(8% + 70px); bottom: 14px; }
.pet .px { height: 34px; width: auto; animation: bob 0.9s steps(2) infinite; }
.hpbox { position: absolute; top: 10px; display: flex; flex-direction: column; gap: 4px; width: 44%; }
.hpbox.me { left: 10px; }
.hpbox.foe { right: 10px; text-align: right; }
.hpbox .nm { font-family: var(--display); font-size: .9rem; line-height: 1.1; text-shadow: 0 2px 0 var(--shadow); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hp { height: 10px; background: #0b0920cc; border: 2px solid var(--shadow); border-radius: 3px; overflow: hidden; }
.hp > i { display: block; height: 100%; background: var(--bad); transition: width .35s; }
.hearts { font-size: 1.05rem; letter-spacing: 2px; color: var(--bad); text-shadow: 0 2px 0 var(--shadow); }
.float { position: absolute; font-family: var(--display); font-size: 1.6rem; color: var(--amber); text-shadow: 0 3px 0 var(--shadow); animation: up .9s forwards; pointer-events: none; }
.combo { position: absolute; left: 50%; top: 44%; transform: translateX(-50%); font-family: var(--display); color: var(--amber); font-size: 1.2rem; text-shadow: 0 3px 0 var(--shadow); }

.qcard { display: flex; flex-direction: column; gap: 12px; }
.qtype { font-family: var(--display); font-size: .85rem; color: var(--amber); text-transform: uppercase; letter-spacing: .08em; }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow button { text-align: center; font-family: var(--display); font-size: 1.3rem; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .colm { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.match button { font-weight: 400; font-size: .92rem; padding: 10px; }
.match button.sel { border-color: var(--amber); background: #4a3a17; }
.match button.ok { border-color: var(--good); background: #1d4a3f; opacity: .7; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.slots { display: flex; flex-direction: column; gap: 6px; min-height: 52px; padding: 8px; border: 3px dashed var(--line); border-radius: 8px; }
.slots button { font-weight: 400; font-size: .95rem; padding: 9px 10px; }
.slots .n { font-family: var(--display); color: var(--amber); margin-right: 8px; }
.chips button { font-weight: 400; font-size: .95rem; padding: 9px 10px; }
.sortitem { text-align: center; padding: 18px 12px; font-size: 1.1rem; font-weight: 700; background: var(--panel2); border: 3px solid var(--amber); border-radius: 8px; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bins button { text-align: center; font-family: var(--display); font-size: 1.05rem; padding: 14px 8px; }
.binlists { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .82rem; color: var(--muted); }
.binlists ul { margin: 0; padding-left: 18px; }
.binlists li.miss { color: var(--bad); }
.fb { border-radius: 8px; padding: 12px 14px; border: 3px solid; display: flex; flex-direction: column; gap: 8px; animation: pop .25s; }
.fb.ok { border-color: var(--good); background: #173b33; }
.fb.no { border-color: var(--bad); background: #3d1a2a; }
.fb .h { font-family: var(--display); font-size: 1.2rem; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* result / lists */
.big { font-family: var(--display); font-size: 2.2rem; color: var(--amber); letter-spacing: 6px; }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { border-left: 4px solid var(--line); padding: 4px 0 4px 10px; }
.note .q { font-weight: 700; }
.note .a { color: var(--good); font-size: .92rem; }
.note .x { color: var(--muted); font-size: .9rem; }
.note.weak { border-left-color: var(--bad); }
details.card summary { cursor: pointer; font-family: var(--display); font-size: 1.1rem; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.card summary::-webkit-details-marker { display: none; }
details.card[open] summary { margin-bottom: 10px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.shop .item { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.shop .item .px { height: 72px; width: auto; }
.shop .item.on { border-color: var(--amber); }
.updbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  width: min(560px, calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  box-sizing: border-box; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--panel2); border: 3px solid var(--amber); border-radius: 10px; box-shadow: 0 6px 0 var(--shadow); }
.updbar .disp { color: var(--amber); font-size: 1.1rem; }
.updbar .small { color: var(--ink); font-size: .85rem; }
.updbar .grow { min-width: 0; }
.updbar button, .updbar .btnlink { padding: 8px 12px; font-size: 1rem; white-space: nowrap; }
.btnlink { display: inline-block; text-align: center; text-decoration: none; font-family: var(--display); background: var(--amber); color: #2a1800; border: 3px solid #ffd28f; border-radius: 6px; box-shadow: 0 4px 0 var(--shadow); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--amber); color: #2a1800; font-family: var(--display); padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 0 var(--shadow); z-index: 20; max-width: 90vw; text-align: center; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.switch button { min-width: 70px; text-align: center; }
.timer { font-family: var(--display); background: var(--shadow); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); border-color: var(--bad); animation: shake .4s infinite; }
.hardbtn { text-align: center; border-color: #7a2f4a; background: #3a1a2e; }
.hardbtn:hover:not(:disabled) { background: #4d2140; }
.hardbtn .disp { display: block; font-size: 1.1rem; }
.hardbtn small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.towerbtn { position: relative; overflow: hidden; padding: 0; min-height: 76px; text-align: left; border-color: #6b4fbf; }
.towerbtn canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.towerbtn .tt { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 14px; background: linear-gradient(90deg, #15122dee 40%, #15122d55); }
.towerbtn .disp { font-size: 1.3rem; }
.towerbtn small { font-weight: 400; color: var(--muted); }
.grp { margin: 10px 0 -2px; font-size: 1.05rem; color: var(--muted); }
.worldbtn { position: relative; overflow: hidden; padding: 0; min-height: 104px; text-align: left; border-width: 2px; }
.worldbtn canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.worldbtn .wt { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; min-height: 104px; justify-content: flex-end;
  background: linear-gradient(90deg, #15122df2 0%, #15122dcc 45%, #15122d33 100%); }
.worldbtn .disp { font-size: 1.3rem; line-height: 1.1; }
.worldbtn small { font-weight: 400; color: var(--ink); font-size: .8rem; text-shadow: 0 1px 0 #000; }
.worldbtn small.crs { color: var(--muted); }
.wbar { display: block; height: 6px; width: min(240px, 70%); background: #0b0920aa; border-radius: 3px; overflow: hidden; margin: 2px 0; }
.wbar i { display: block; height: 100%; }
.area { display: flex; flex-direction: column; gap: 6px; }
.areahead { position: relative; overflow: hidden; border: 2px solid var(--line); border-radius: 8px; min-height: 66px; box-shadow: 0 4px 0 var(--shadow); }
.areahead canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.areahead .at { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; min-height: 66px; justify-content: center;
  background: linear-gradient(90deg, #15122df0 0%, #15122daa 50%, #15122d22 100%); }
.areahead .tag { font-size: .8rem; letter-spacing: .08em; }
.areahead .disp { font-size: 1.15rem; line-height: 1.1; }
.areahead small { color: var(--muted); font-size: .78rem; }
#t-cont { font-size: 1.05rem; }
details.lesson { background: #1b2a4a; border: 2px solid #3d5c99; border-radius: 8px; padding: 10px 12px; }
details.lesson summary { cursor: pointer; font-family: var(--display); color: #8fd3ff; }
details.lesson ul { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.tip { background: #2a2350; border: 2px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }

@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes hit { 0%, 100% { filter: none; transform: none; } 30% { filter: brightness(3) saturate(0); transform: translateX(6px); } 60% { transform: translateX(-4px); } }
@keyframes lunge { 50% { transform: translateX(26px); } }
@keyframes lungeL { 50% { transform: translateX(-26px); } }
@keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } }
@keyframes pulse { 50% { box-shadow: 0 4px 0 var(--shadow), 0 0 0 6px #ffb54740; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <div id="hud"></div>
  <main id="view" class="col"></main>
</div>
<div id="toast" class="toast" hidden></div>
